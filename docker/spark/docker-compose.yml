services:
  spark:
    image: ecommerce-spark:3.5.5-hadoop-aws
    container_name: ecommerce-spark
    networks:
      - ecommerce-lakehouse
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8080:8080"
      - "8888:8888"
      - "10000:10000"
      - "10001:10001"
    volumes:
      - ../../notebooks:/home/iceberg/notebooks/notebooks
      - ../../data:/home/iceberg/data
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    deploy:
      resources:
        limits:
          memory: 1536M

networks:
  ecommerce-lakehouse:
    external: true
