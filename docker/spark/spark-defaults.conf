spark.sql.extensions                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

spark.sql.catalog.ecommerce             org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.ecommerce.type        rest
spark.sql.catalog.ecommerce.uri         http://iceberg-rest:8181
spark.sql.catalog.ecommerce.warehouse   s3a://ecommerce/iceberg/
spark.sql.catalog.ecommerce.s3.endpoint             http://minio:9000
spark.sql.catalog.ecommerce.s3.path-style-access     true
spark.sql.catalog.ecommerce.s3.access-key-id         minioadmin
spark.sql.catalog.ecommerce.s3.secret-access-key     minioadmin

spark.sql.defaultCatalog                ecommerce

spark.eventLog.enabled                  true
spark.eventLog.dir                      /home/iceberg/spark-events
spark.history.fs.logDirectory           /home/iceberg/spark-events

spark.sql.catalogImplementation         in-memory

# MinIO S3A configuration
spark.hadoop.fs.s3a.endpoint                         http://minio:9000
spark.hadoop.fs.s3a.access.key                      minioadmin
spark.hadoop.fs.s3a.secret.key                      minioadmin
spark.hadoop.fs.s3a.path.style.access               true
spark.hadoop.fs.s3a.connection.ssl.enabled          false
spark.hadoop.fs.s3a.impl                            org.apache.hadoop.fs.s3a.S3AFileSystem
