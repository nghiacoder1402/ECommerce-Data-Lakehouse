services:
  trino:
    image: trinodb/trino:latest
    container_name: trino
    hostname: trino

    ports:
      - "8081:8080"

    volumes:
      - ./etc:/etc/trino

    networks:
      - ecommerce-lakehouse

    deploy:
      resources:
        limits:
          memory: 1.5G

networks:
  ecommerce-lakehouse:
    external: true
